    <!-- HELSKÄRMSVISNING MED TEXTRUTA -->
<div id="image-modal" class="modal">
    <button id="close-modal" class="modal-close">Stäng</button>
    <button id="prev-btn" class="modal-arrow prev-arrow">&lsaquo;</button>
    <button id="next-btn" class="modal-arrow next-arrow">&rsaquo;</button>
    
    <!-- En ny behållare som håller både bilden och textrutan bredvid varandra -->
    <div class="modal-wrapper">
        <div class="modal-image-container">
            <img id="modal-img" class="modal-content" src="" alt="Helskärmsvisning">
        </div>
        
        <!-- Den nya subtila textrutan till höger -->
        <div id="modal-text-box" class="modal-text-box">
            <h3 id="modal-art-title">Titel</h3>
            <p id="modal-art-info">Information om verket...</p>
        </div>
    </div>
</div>

<script>
    const modal = document.getElementById("image-modal");
    const modalImg = document.getElementById("modal-img");
    const modalTextBox = document.getElementById("modal-text-box");
    const modalArtTitle = document.getElementById("modal-art-title");
    const modalArtInfo = document.getElementById("modal-art-info");
    const closeModalBtn = document.getElementById("close-modal");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    
    const flowLinks = Array.from(document.querySelectorAll(".flow-item"));
    let currentModalIndex = 0;

    // Funktion som uppdaterar BÅDE bild och text mjukt
    function updateModalImage(index) {
        currentModalIndex = index;
        const clickedLink = flowLinks[currentModalIndex];
        const nextSrc = clickedLink.querySelector("img").src;
        
        // Hämta texterna från HTML-länkens data-attribut
        const nextTitle = clickedLink.getAttribute("data-title") || "Utan titel";
        const nextInfo = clickedLink.getAttribute("data-info") || "";
        
        // 1. Tona ut både bild och textkort
        modalImg.style.opacity = 0;
        modalTextBox.style.opacity = 0;
        
        // 2. Byt ut innehållet under tiden det är osynligt
        setTimeout(() => {
            modalImg.src = nextSrc;
            modalArtTitle.textContent = nextTitle;
            modalArtInfo.textContent = nextInfo;
            
            // 3. Tona in det nya verket och den nya texten samtidigt
            modalImg.style.opacity = 1;
            modalTextBox.style.opacity = 1;
        }, 200);
    }

    function showNextImage() {
        let nextIndex = (currentModalIndex + 1) % flowLinks.length;
        updateModalImage(nextIndex);
    }

    function showPrevImage() {
        let prevIndex = (currentModalIndex - 1 + flowLinks.length) % flowLinks.length;
        updateModalImage(prevIndex);
    }

    flowLinks.forEach((link, index) => {
        link.addEventListener("click", function(event) {
            event.preventDefault();
            modal.classList.add("show");
            updateModalImage(index);
        });
    });

    function closeModal() { modal.classList.remove("show"); }
    closeModalBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal || e.target.classList.contains('modal-wrapper')) closeModal(); });
    nextBtn.addEventListener("click", (e) => { e.stopPropagation(); showNextImage(); });
    prevBtn.addEventListener("click", (e) => { e.stopPropagation(); showPrevImage(); });

    document.addEventListener("keydown", function(event) {
        if (!modal.classList.contains("show")) return;
        if (event.key === "ArrowRight") showNextImage();
        else if (event.key === "ArrowLeft") showPrevImage();
        else if (event.key === "Escape") closeModal();
    });
</script>

<!-- JAVASCRIPT FÖR DYNAMISK SKROLL-INTONING -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const flowItems = document.querySelectorAll(".flow-item");

        // Inställningar för skroll-lyssnaren
        const observerOptions = {
            root: null, // Utgår från webbläsarfönstret
            rootMargin: "0px", 
            threshold: 0.15 // Bilden måste synas till minst 15% för att trigga effekten
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Om bilden skrollas in på skärmen (uppifrån eller nedifrån): Aktivera animationen
                    entry.target.classList.add("animate-in");
                } else {
                    // Om bilden skrollas ut och försvinner från skärmen: Nollställ klassen
                    // Detta gör att effekten körs igen när man vänder och skrollar tillbaka
                    entry.target.classList.remove("animate-in");
                }
            });
        }, observerOptions);

        // Starta lyssnaren för varje enskild bild i flödet
        flowItems.forEach(item => {
            observer.observe(item);
        });
    });
</script>

<script src="smoothscroll.js"></script>
